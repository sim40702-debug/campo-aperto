# Prova temporanea: su Windows si installa la 0.13.0 e si prova l'aggiornamento automatico alla release più nuova
name: Prova aggiornamento Windows
on:
  push:
    branches: [test-aggiornamento-win]
jobs:
  prova-utente:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installa la 0.13.0 e prova l'aggiornamento (utente)
        run: |
          set +e
          npm init -y > /dev/null && npm i playwright-core@1.48.2 > /dev/null
          if [ utente = portable ]; then
            mkdir -p "$USERPROFILE/Desktop/Gioco"
            curl -sL -o "$USERPROFILE/Desktop/Gioco/CampoAperto.exe" https://github.com/sim40702-debug/campo-aperto/releases/download/v0.13.0/CampoAperto-0.13.0-portable.exe
            exe="$USERPROFILE/Desktop/Gioco/CampoAperto.exe"
          else
            curl -sL -o setup.exe https://github.com/sim40702-debug/campo-aperto/releases/download/v0.13.0/CampoAperto-0.13.0-win-x64.exe
            if [ utente = tutti ]; then ./setup.exe //S //allusers; else ./setup.exe //S; fi
            sleep 20
            exe=$(find "$LOCALAPPDATA/Programs" "/c/Program Files" -maxdepth 2 -iname "Campo Aperto.exe" 2>/dev/null | head -1)
          fi
          echo "::warning title=exe-prima::$exe $(powershell -NoProfile -Command "(Get-Item '$exe').VersionInfo.ProductVersion")"
          "$exe" --remote-debugging-port=9222 > app.log 2>&1 &
          sleep 40
          cat > go.js <<'JS'
          const { chromium } = require('playwright-core');
          (async () => {
            const b = await chromium.connectOverCDP('http://127.0.0.1:9222');
            const pg = b.contexts().flatMap(c => c.pages()).find(p => p.url().includes('index.html'));
            console.log('controlla', JSON.stringify(await pg.evaluate(() => window.campoUpdate.controlla())).slice(0, 200));
            pg.evaluate(() => window.campoUpdate.aggiorna()).catch(() => {});
            let st;
            for (let i = 0; i < 300; i++) {
              try { st = await pg.evaluate(() => window.campoUpdate.stato()); } catch (e) { console.log('pagina chiusa'); break; }
              if (st.fase === 'errore') break;
              await new Promise(r => setTimeout(r, 1000));
            }
            console.log('ultimo stato', JSON.stringify(Object.assign({}, st, { note: undefined })));
            process.exit(0);
          })().catch(e => { console.log('errore', e.message); process.exit(0); });
          JS
          node go.js > go.log 2>&1
          sleep 120
          while IFS= read -r l; do echo "::warning title=go::${l:0:900}"; done < go.log
          echo "::warning title=exe-dopo::$(powershell -NoProfile -Command "(Get-Item '$exe').VersionInfo.ProductVersion")"
          echo "::warning title=processi::$(tasklist | grep -i -E 'campo|installer|setup|cmd' | tr -s ' ' | tr '\n' ';')"
          ls "$USERPROFILE/Desktop/Gioco" 2>/dev/null | tr '\n' ' ' | sed 's/^/::warning title=cartella::/'; echo

