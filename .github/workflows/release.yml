# Compila l'app per Windows, Mac e Linux e la pubblica in una release (tag v<versione di package.json>).
# Due canali:
#   pubblica  repository pubblico dei download (package.json "releasesRepo"): la scaricano tutti e l'app si aggiorna da lì
#   prova     questo repository (privato), come pre-release: per provare una versione tra di noi prima di pubblicarla.
#             L'app non la vede come aggiornamento; si scarica a mano da GitHub (serve l'accesso al repository)
#   questo-repository  release normale in questo repository: serve solo come "ponte" per le app vecchie (fino alla
#             0.14.0), che cercano gli aggiornamenti qui; dalla 0.14.1 l'app guarda il repository dei download
# Parte con un tag di versione (es. v0.5.0, canale pubblica) o a mano dalla scheda Actions scegliendo il canale.
# I tre sistemi compilano senza pubblicare; quando hanno finito, l'ultimo passo crea (o completa) la release con i
# file pronti e la pubblica. Se un sistema non parte (GitHub senza macchine libere per quel sistema) lo si può annullare
# dalla scheda Actions e la release esce con gli altri; rilanciando il flusso più tardi i file mancanti si aggiungono
# alla stessa release. Un errore vero di compilazione o dei test, invece, ferma tutto.
name: Rilascio app desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      canale:
        description: 'Dove esce la versione: prova (privata, tra di noi) o pubblica (download per tutti, aggiornamento dall''app)'
        type: choice
        options: [prova, pubblica, questo-repository]
        default: prova
      rimuovi:
        description: 'Release da togliere prima di pubblicare (tag separati da virgola, es. v0.14.2,v0.14.1-prova). Vuoto = niente'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux: .AppImage e .deb. Se la macchina Linux resta in coda, annullare solo quel lavoro: la release parte lo stesso
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # bash anche su Windows: PowerShell spezza gli argomenti tipo "-c.publish.x=y"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm test
      - name: Compila
        run: |
          case "$RUNNER_OS" in
            Windows) npm run dist:win -- --publish never ;;
            macOS) npm run dist:mac -- --publish never ;;
            Linux) npm run dist:linux -- --publish never ;;
          esac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # server dell'economia incluso nel gioco (variabile del repository, vedi docs/ECONOMIA.md); vuoto = da impostare nel gioco
          CAMPO_API_URL: ${{ vars.CAMPO_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            release/*/CampoAperto-*
            release/*/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    # pubblica anche se un sistema è stato annullato (mai partito), non se uno è fallito davvero
    if: ${{ always() && !contains(needs.*.result, 'failure') }}
    # su Windows (bash di Git e gh preinstallati): non dipende dalle macchine Linux
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Togli le release indicate (e i loro tag) da questo repository
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rimuovi != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RIMUOVI: ${{ inputs.rimuovi }}
        run: |
          IFS=',' read -ra tags <<< "$RIMUOVI"
          for t in "${tags[@]}"; do
            t=$(echo "$t" | tr -d ' ')
            [ -n "$t" ] || continue
            gh release delete "$t" --yes --cleanup-tag && echo "tolta $t" || echo "$t non c'era"
          done
      - name: Versione di prova (pre-release in questo repository privato)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.canale == 'prova' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v-prova"
          awk -v h="## $v " 'index($0, h) == 1 { f = 1; next } /^## / { if (f) exit } f' docs/CHANGELOG.md > notes.md
          node scripts/latest-portable.js files
          shopt -s globstar nullglob
          list=(); for f in files/**/*; do [ -f "$f" ] && list+=("$f"); done
          [ ${#list[@]} -gt 0 ] || { echo "nessun file da pubblicare"; exit 1; }
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${list[@]}" --clobber
          else
            gh release create "$tag" "${list[@]}" --target "$GITHUB_SHA" --prerelease --title "Campo Aperto $v (prova)" --notes-file notes.md
          fi
          echo "### Campo Aperto $v di prova: Releases di questo repository ($tag)" >> "$GITHUB_STEP_SUMMARY"
      - name: Release ponte in questo repository (per le app fino alla 0.14.0)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.canale == 'questo-repository' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          awk -v h="## $v " 'index($0, h) == 1 { f = 1; next } /^## / { if (f) exit } f' docs/CHANGELOG.md > notes.md
          node scripts/latest-portable.js files
          shopt -s globstar nullglob
          list=(); for f in files/**/*; do [ -f "$f" ] && list+=("$f"); done
          [ ${#list[@]} -gt 0 ] || { echo "nessun file da pubblicare"; exit 1; }
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${list[@]}" --clobber
            gh release edit "$tag" --draft=false --prerelease=false --latest --title "Campo Aperto $v" --notes-file notes.md
          else
            gh release create "$tag" "${list[@]}" --target "$GITHUB_SHA" --latest --title "Campo Aperto $v" --notes-file notes.md
          fi
          echo "### Campo Aperto $v pubblicata in questo repository (ponte per le app vecchie)" >> "$GITHUB_STEP_SUMMARY"
      - name: Pubblica la release con i file di tutti i sistemi
        # canale pubblica: le versioni escono nel repository pubblico dei download (package.json "releasesRepo"), non
        # in questo (privato): serve il segreto RELEASES_TOKEN, un token con il permesso Contents (lettura e scrittura) su quel repository
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.canale == 'pubblica' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "### Release non pubblicata" >> "$GITHUB_STEP_SUMMARY"
            echo "Manca il segreto RELEASES_TOKEN (token con accesso al repository dei download, vedi README)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          repo=$(node -p "require('./package.json').releasesRepo")
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          # note: la sezione della versione nel CHANGELOG
          awk -v h="## $v " 'index($0, h) == 1 { f = 1; next } /^## / { if (f) exit } f' docs/CHANGELOG.md > notes.md
          # impronta della versione portable per l'aggiornamento automatico (latest.yml c'è solo per l'installer)
          node scripts/latest-portable.js files
          shopt -s globstar nullglob
          list=(); for f in files/**/*; do [ -f "$f" ] && list+=("$f"); done
          [ ${#list[@]} -gt 0 ] || { echo "nessun file da pubblicare"; exit 1; }
          printf '%s\n' "${list[@]}"
          # repository dei download ancora vuoto: GitHub vuole almeno un file prima di una release (la pagina dei download)
          if ! gh api "repos/$repo/commits?per_page=1" > /dev/null 2>&1; then
            content=$(node -e "process.stdout.write(require('fs').readFileSync('scripts/README-download.md').toString('base64'))")
            gh api -X PUT "repos/$repo/contents/README.md" -f message="Pagina dei download di Campo Aperto" -f content="$content"
          fi
          if gh release view "$tag" --repo "$repo" > /dev/null 2>&1; then
            gh release upload "$tag" "${list[@]}" --clobber --repo "$repo"
            gh release edit "$tag" --draft=false --title "Campo Aperto $v" --notes-file notes.md --repo "$repo"
          else
            gh release create "$tag" "${list[@]}" --title "Campo Aperto $v" --notes-file notes.md --repo "$repo"
          fi
          echo "### Campo Aperto $v pubblicata in $repo" >> "$GITHUB_STEP_SUMMARY"
