# Compila l'app per Windows e Mac e la pubblica in una release (tag v<versione di package.json>).
# Parte con un tag di versione (es. v0.5.0) o a mano dalla scheda Actions.
# I due sistemi compilano senza pubblicare; quando hanno finito, l'ultimo passo crea (o completa) la release con i
# file pronti e la pubblica. Se un sistema non parte (GitHub senza macchine libere per quel sistema) la release esce con
# gli altri; rilanciando il flusso più tardi i file mancanti si aggiungono alla stessa release. Un errore vero di
# compilazione o dei test, invece, ferma tutto.
name: Rilascio app desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # niente Linux: le macchine Linux di GitHub restavano in coda e bloccavano la release (in locale: npm run dist:linux)
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # bash anche su Windows: PowerShell spezza gli argomenti tipo "-c.publish.x=y"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm test
      - name: Compila
        run: |
          case "$RUNNER_OS" in
            Windows) npm run dist:win -- --publish never ;;
            macOS) npm run dist:mac -- --publish never ;;
          esac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # server dell'economia incluso nel gioco (variabile del repository, vedi docs/ECONOMIA.md); vuoto = da impostare nel gioco
          CAMPO_API_URL: ${{ vars.CAMPO_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            release/*/CampoAperto-*
            release/*/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    # pubblica anche se un sistema è stato annullato (mai partito), non se uno è fallito davvero
    if: ${{ always() && !contains(needs.*.result, 'failure') }}
    # su Windows (bash di Git e gh preinstallati): non dipende dalle macchine Linux
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Pubblica la release con i file di tutti i sistemi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          # note: la sezione della versione nel CHANGELOG
          awk -v h="## $v " 'index($0, h) == 1 { f = 1; next } /^## / { if (f) exit } f' docs/CHANGELOG.md > notes.md
          shopt -s globstar nullglob
          list=(); for f in files/**/*; do [ -f "$f" ] && list+=("$f"); done
          [ ${#list[@]} -gt 0 ] || { echo "nessun file da pubblicare"; exit 1; }
          printf '%s\n' "${list[@]}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${list[@]}" --clobber
            gh release edit "$tag" --draft=false --title "Campo Aperto $v" --notes-file notes.md
          else
            gh release create "$tag" "${list[@]}" --target "$GITHUB_SHA" --title "Campo Aperto $v" --notes-file notes.md
          fi
